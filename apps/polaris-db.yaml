apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: polaris-db
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE-ME/lakehouse-lab.git
    targetRevision: main
    path: manifests/polaris-db
  destination:
    server: https://kubernetes.default.svc
    namespace: polaris
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
